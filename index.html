function Count({v,f=rp}){
  const [x,setX]=useState(0),ref=React.useRef(0);
  useEffect(()=>{
    const a=ref.current,b=v;
    if(a===b){setX(b);return}
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){ref.current=b;setX(b);return}
    let raf,t0;
    const step=t=>{t0=t0||t;const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3),cur=a+(b-a)*e;ref.current=cur;setX(cur);if(p<1)raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf);
  },[v]);
  return <>{f(x)}</>;
}

function Confetti({k}){

  return <div className="fixed inset-0 z-[70] pointer-events-none flex items-center justify-center" aria-hidden="true">{ps.map((p,i)=><i key={i} className="burst absolute w-2.5 h-3.5 rounded-sm" style={{"--x":p.x+"px","--y":p.y+"px","--r":p.r+"deg",background:p.c,animationDelay:p.d+"ms"}}/>)}</div>;

function Spark({data,color,h=36,w=110}){
  const mn=Math.min(...data),mx=Math.max(...data),sp=mx-mn||1;
  const pts=data.map((v,i)=>(i/(data.length-1)*w).toFixed(1)+","+(h-4-((v-mn)/sp)*(h-8)).toFixed(1)).join(" ");
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}><polyline points={pts} pathLength="1" className="draw" fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}
function Line({data,h=150}){
  const w=400,mn=Math.min(...data),mx=Math.max(...data),sp=mx-mn||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w,h-12-((v-mn)/sp)*(h-28)]);

    <polygon points={`0,${h} ${l} ${w},${h}`} fill="url(#lg)"/><polyline points={l} pathLength="1" className="draw" fill="none" stroke="#059669" strokeWidth="2.5" strokeLinejoin="round"/>
    <circle cx={pts[pts.length-1][0]-3} cy={pts[pts.length-1][1]} r="4" fill="#059669" className="fade" style={{animationDelay:"1s"}}/></svg>;
}
function Bars({b}){

    {b.map((x,i)=>{const cw=Math.min(14,bw/3),hi=x.inc/mx*(H-10),he=x.exp/mx*(H-10),cx=i*bw+bw/2;

      <text x={cx} y={H+15} textAnchor="middle" fontSize="10" fill="#94a3b8">{x.l}</text></g>})}
  </svg>;
}

function Analytics({d}){
  const [r,setR]=useState("month");
  const {b,items,total,ti,te}=useMemo(()=>{
    const N={week:7,month:4,year:12}[r],b=Array.from({length:N},(_,i)=>({l:"",inc:0,exp:0}));
    const now=new Date(),mn=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"],dn=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
    b.forEach((x,i)=>{if(r==="week"){const t=new Date();t.setDate(t.getDate()-(6-i));x.l=dn[t.getDay()]}else if(r==="month")x.l=["M-3","M-2","M-1","Kini"][i];else{const t=new Date(now.getFullYear(),now.getMonth()-(11-i),1);x.l=mn[t.getMonth()]}});
    const cat={};
    d.tx.forEach(t=>{let i;const df=diffD(t.date);if(df<0)return;
      if(r==="week")i=6-df;else if(r==="month")i=3-Math.floor(df/7);else{const dt=new Date(t.date+"T00:00:00");i=11-((now.getFullYear()-dt.getFullYear())*12+now.getMonth()-dt.getMonth())}
      if(i<0||i>=N)return;
      if(t.type==="income")b[i].inc+=t.amt;else if(t.type==="expense"){b[i].exp+=t.amt;cat[t.cat]=(cat[t.cat]||0)+t.amt}});
    const items=Object.entries(cat).sort((a,c)=>c[1]-a[1]);
    return{b,items,total:items.reduce((s,x)=>s+x[1],0),ti:b.reduce((s,x)=>s+x.inc,0),te:b.reduce((s,x)=>s+x.exp,0)};
  },[d.tx,r]);
  return <div className="st space-y-5">
    <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-100 rounded-2xl">{[["week","Mingguan"],["month","Bulanan"],["year","Tahunan"]].map(([k,l])=><button key={k} onClick={()=>setR(k)} className={"py-2.5 rounded-xl text-sm font-semibold transition "+(r===k?"bg-white shadow text-emerald-700":"text-slate-500")}>{l}</button>)}</div>
    <Card className="p-5"><h2 className="font-bold mb-1">Pemasukan vs pengeluaran</h2>
      <div className="flex gap-4 text-xs text-slate-500 mb-3"><span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded bg-emerald-600"/>Masuk {sh(ti)}</span><span className="flex items-center gap-1.5"><i className="w-2.5 h-2.5 rounded bg-emerald-200"/>Keluar {sh(te)}</span></div>
      <Bars key={r} b={b}/></Card>
    <Card className="p-5"><h2 className="font-bold mb-4 flex items-center gap-2"><I n="pie" s={18} c="text-emerald-600"/>Rincian pengeluaran</h2>
      {total?<div className="flex flex-col sm:flex-row items-center gap-6"><div className="relative"><Donut items={items} total={total}/><div className="absolute inset-0 flex flex-col items-center justify-center"><span className="text-xs text-slate-400">Total</span><span className="font-extrabold">{sh(total)}</span></div></div>
        <div className="w-full space-y-2.5">{items.map(([c,v])=><div key={c} className="flex items-center gap-3 text-sm"><i className="w-3 h-3 rounded-full shrink-0" style={{background:CAT[c]}}/><span className="flex-1 font-medium">{c}</span><span className="text-slate-400">{Math.round(v/total*100)}%</span><span className="font-semibold w-20 text-right">{sh(v)}</span></div>)}</div></div>:<Empty t="Belum ada pengeluaran di periode ini."/>}</Card>
  </div>;
}

  </div>;

function Invest({d,px,refresh,pxt,pxe,open,del,topup,setval}){
  const [ai,setAi]=useState(null),[busy,setBusy]=useState(false),[err,setErr]=useState("");

  const tot=rows.reduce((s,r)=>s+r.v,0),cost=rows.reduce((s,r)=>s+(r.a.cost||r.v),0),pl=tot-cost;
  const line=useMemo(()=>{const L=Math.min(20,...rows.filter(r=>r.s).map(r=>r.s.length));if(!isFinite(L)||L<2)return null;
    return Array.from({length:L},(_,i)=>rows.reduce((s,r)=>s+(r.s?r.a.units*r.s[r.s.length-L+i]:r.v),0))},[d.inv,px]);
  const analyze=async()=>{
    const assets=rows.filter(r=>r.s).map(r=>({name:r.a.name,type:r.a.type,series:r.s.map(v=>+(v/r.s[0]).toFixed(4))}));
    if(!assets.length)return setErr("Belum ada data harga untuk dianalisis.");
    setBusy(true);setErr("");
    try{const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assets})});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status+" (fitur ini hanya jalan setelah deploy ke Netlify)"));
      setAi({...j,time:new Date().toLocaleTimeString("id-ID")})}catch(e){setErr("Gagal: "+e.message)}
    setBusy(false)};
  const rec=s=>{const x=st(s);return x>=0?(x>.03?"Momentum kuat. Tahan posisi, tambah bertahap (DCA) bila perlu.":"Tren naik tipis. Pertahankan posisi dan pantau."):(x<-.03?"Tekanan turun cukup dalam. Tunda tambah posisi sampai stabil.":"Tren melemah ringan. Tahan dan pantau.")};
  const gn=id=>(d.mm.dreams.find(x=>x.id===id)||{}).name;
  const unit=a=>a.manual&&!(a.units>0)?"nilai manual":a.units+(a.type==="Emas"?" g":a.type==="Saham"?" lbr":" unit");
  return <div className="st space-y-5">
    <Card className="p-5"><div className="flex items-start justify-between"><div><p className="text-sm text-slate-500">Nilai portofolio</p><p className="text-3xl font-extrabold tracking-tight mt-1"><Count v={tot}/></p></div>
      <button onClick={refresh} className="flex items-center gap-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-full px-3 py-2"><I n="reset" s={14}/>Perbarui</button></div>
      <p className={"text-sm font-semibold mt-1 flex items-center gap-1 "+(pl>=0?"text-emerald-600":"text-red-500")}><I n={pl>=0?"up":"down"} s={16}/>{rp(pl)} ({cost?(pl/cost*100).toFixed(2):"0.00"}%)</p>
      {line?<div className="mt-3"><Line data={line}/></div>:<Empty t="Grafik muncul setelah data harga dimuat."/>}
      <p className="text-[11px] text-slate-400 mt-2">{pxe?pxe:(pxt?"Harga dari Yahoo Finance, diperbarui "+new Date(pxt).toLocaleTimeString("id-ID")+". Data saham bisa tertunda.":"Memuat harga...")}</p></Card>
    <Card className="p-5"><div className="flex items-center gap-2 mb-1"><span className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center"><I n="zap" s={18}/></span><div><h2 className="font-bold leading-tight">Status pasar AI</h2><p className="text-xs text-slate-400">Tren dari harga asli. Bukan saran investasi.</p></div></div>
      <div className="my-3 rounded-xl bg-emerald-50 p-3">
        <Btn onClick={analyze} disabled={busy||!d.inv.length} className="w-full !py-2 disabled:opacity-60">{busy?"Menganalisis...":"Analisis dengan Gemini"}</Btn>
        {err&&<p className="text-xs text-red-600 mt-2" role="alert">{err}</p>}
        {ai&&ai.overall&&<p className="text-xs text-emerald-800 mt-2"><b>Ringkasan Gemini ({ai.time}):</b> {ai.overall}</p>}
      </div>
      {d.inv.length?<div className="divide-y divide-slate-100">{rows.map(({a,s,p})=>{const x=st(s),bull=x>=0;return <div key={a.id} className="py-3.5">
        <div className="flex items-center gap-3"><div className="flex-1 min-w-0"><p className="font-semibold text-sm truncate">{a.name}</p>
          {a.manual?<span className="inline-flex text-xs font-semibold rounded-full px-2.5 py-1 mt-1 bg-slate-100 text-slate-500">Manual, tanpa data tren</span>
          :s?<span className={"inline-flex items-center gap-1.5 text-xs font-bold rounded-full px-2.5 py-1 mt-1 "+(bull?"bg-emerald-50 text-emerald-700":"bg-red-50 text-red-600")}><i className={"w-1.5 h-1.5 rounded-full "+(bull?"bg-emerald-500":"bg-red-500")}/>{bull?"Bullish":"Bearish"} {(x*100).toFixed(1)}% / 5 hari</span>
          :<span className="inline-flex text-xs font-semibold rounded-full px-2.5 py-1 mt-1 bg-amber-50 text-amber-700">{p&&p.error?"Gagal: "+p.error:(pxe?"Harga belum tersedia":"Memuat harga...")}</span>}</div>
          {s&&<Spark data={s} color={bull?"#059669":"#ef4444"}/>}</div>
        {s&&<p className="text-xs text-slate-500 mt-2">{rec(s)}</p>}
        {(()=>{const it=ai&&ai.items&&ai.items.find(i=>i.name===a.name);return it?<p className="text-xs text-emerald-800 bg-emerald-50 rounded-lg px-3 py-2 mt-2"><b>Gemini: {it.status}.</b> {it.summary} {it.action}</p>:null})()}</div>})}</div>:<Empty t="Tambahkan aset untuk melihat status pasar."/>}</Card>
    <div className="flex items-center justify-between"><h2 className="font-bold">Aset investasi</h2><Btn onClick={()=>open("inv")} className="!py-2.5 flex items-center gap-1.5"><I n="plus" s={16}/>Aset</Btn></div>
    {d.inv.length?<div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{rows.map(({a,v})=>{const c=a.cost||v,p=v-c;return <Card key={a.id} className="lift p-4 flex items-center gap-3 min-w-0">

      <div className="flex-1 min-w-0"><p className="font-semibold text-sm truncate">{a.name}</p><p className="text-xs text-slate-400">{a.type} - {unit(a)}</p>{gn(a.goal)&&<p className="text-[11px] font-semibold text-emerald-700 truncate mt-0.5">Untuk: {gn(a.goal)}</p>}{a.manual&&<div className="flex gap-3 mt-1"><button onClick={()=>{const n=num(prompt("Nominal top up (Rp)"));n>0&&topup(a,n)}} className="text-[11px] font-bold text-emerald-700">Top up</button>{!(a.units>0&&a.nav>0)&&<button onClick={()=>{const v=num(prompt("Nilai saat ini di aplikasi (Rp)"));v>0&&setval(a.id,v)}} className="text-[11px] font-bold text-slate-500">Update nilai</button>}</div>}</div>
      <div className="text-right shrink-0"><p className="font-bold text-sm whitespace-nowrap">{rp(v)}</p><p className={"text-xs font-semibold "+(p>=0?"text-emerald-600":"text-red-500")}>{p>=0?"+":""}{sh(p)}</p></div>
      <button onClick={()=>confirm("Hapus aset ini?")&&del(a.id)} aria-label="Hapus aset" className="text-slate-300 hover:text-red-500 p-1"><I n="trash" s={16}/></button></Card>})}</div>:<Card><Empty t="Belum ada aset investasi."/></Card>}
  </div>;
}

const HC={slate:"bg-slate-100 text-slate-600",red:"bg-red-50 text-red-600",amber:"bg-amber-50 text-amber-700",emerald:"bg-emerald-50 text-emerald-700"};
function AllocChart({v}){
  const r=React.useRef(),c=React.useRef();
  useEffect(()=>{if(!window.Chart||!r.current)return;if(c.current)c.current.destroy();
    c.current=new Chart(r.current,{type:"doughnut",data:{labels:["Kebutuhan wajib","Dana darurat","Investasi & goals"],datasets:[{data:v,backgroundColor:["#64748b","#34d399","#059669"],borderWidth:0}]},options:{cutout:"68%",plugins:{legend:{display:false}},animation:{duration:700}}});
    return()=>{c.current&&c.current.destroy()}},[v.join()]);
  return <canvas ref={r}/>;
}
function Manager({d,px,setD,toast}){
  const m=d.mm,up=p=>setD(s=>({...s,mm:{...s.mm,...p}})),addTx=o=>setD(s=>({...s,tx:[{id:uid(),date:iso(new Date()),...o},...s.tx]}));
  const [bf,setBf]=useState({name:"",amt:"",tenor:"",left:"",due:""}),[df,setDf]=useState({name:"",target:"",months:""}),[dep,setDep]=useState({});
  const mk=iso(new Date()).slice(0,7),pri=m.mode==="pri";
  const sal=useMemo(()=>{const g=d.tx.filter(t=>t.type==="income"&&t.cat==="Gaji");const cur=g.filter(t=>t.date.startsWith(mk)).reduce((s,t)=>s+t.amt,0);if(cur)return cur;const l=[...g].sort((a,b)=>b.date.localeCompare(a.date))[0];return l?l.amt:0},[d.tx]);
  const commute=Math.round(num(m.amt)*dec(m.freq)*4.33);
  const bills=m.bills.filter(b=>b.left>0).reduce((s,b)=>s+b.amt,0);
  const needs=commute+bills,ef=Math.round(sal*.15),inv=Math.max(0,sal-needs-ef);
  const debtPct=sal?bills/sal*100:0,needPct=sal?needs/sal*100:0;
  const [hc,hl]=!sal?["slate","Belum ada Gaji"]:debtPct>30?["red","Beban cicilan terlalu tinggi"]:needPct>50?["amber","Kebutuhan wajib besar"]:["emerald","Sehat"];
  const cash=d.tx.reduce((s,t)=>s+(t.type==="income"?t.amt:-t.amt),0);
  const dsum=x=>x.saved+d.inv.reduce((s,a)=>s+(a.goal===x.id?val(a,px):0),0);
  const nw=cash+d.inv.reduce((s,a)=>s+val(a,px),0)+m.dreams.reduce((s,x)=>s+x.saved,0);
  const mo=x=>Math.max(0,Math.ceil((x.target-dsum(x))/x.months));
  const gTot=m.dreams.reduce((s,x)=>s+mo(x),0);
  const eta=n=>{const t=new Date();t.setMonth(t.getMonth()+n);return t.toLocaleDateString("id-ID",{month:"long",year:"numeric"})};
  const addBill=()=>{const a=num(bf.amt),t=num(bf.tenor),l=bf.left===""?t:Math.min(t,num(bf.left));if(!bf.name.trim()||!a||!t)return;up({bills:[...m.bills,{id:uid(),name:bf.name.trim(),amt:a,tenor:t,left:l,due:Math.min(31,num(bf.due)),last:""}]});setBf({name:"",amt:"",tenor:"",left:"",due:""})};
  const payBill=b=>{addTx({type:"expense",amt:b.amt,cat:"Tagihan",note:"Cicilan: "+b.name});up({bills:m.bills.map(x=>x.id===b.id?{...x,left:x.left-1,last:mk}:x)});toast("Cicilan dibayar: "+b.name+" ("+rp(b.amt)+")")};
  const addDream=()=>{const t=num(df.target),n=num(df.months);if(!df.name.trim()||!t||!n)return;up({dreams:[...m.dreams,{id:uid(),name:df.name.trim(),target:t,saved:0,months:n}]});setDf({name:"",target:"",months:""})};
  const deposit=x=>{const n=num(dep[x.id]);if(!n)return;addTx({type:"transfer",amt:n,cat:"Tabungan",note:"Setor: "+x.name});up({dreams:m.dreams.map(y=>y.id===x.id?{...y,saved:y.saved+n}:y)});setDep({...dep,[x.id]:""});toast("Disetor ke "+x.name+": "+rp(n))};

  return <div className="st space-y-5">
    <div className="rounded-3xl bg-gradient-to-br from-emerald-600 to-emerald-800 text-white p-6 shadow-xl shadow-emerald-600/20">
      <p className="text-sm text-emerald-100">Net worth (kas + aset)</p><p className="text-3xl font-extrabold mt-1"><Count v={nw}/></p>
      <div className="flex gap-3 mt-4 text-xs"><div className="flex-1 rounded-2xl bg-white/15 p-3"><p className="text-emerald-100">Saldo kas</p><p className="font-bold text-sm mt-1">{rp(cash)}</p></div><div className="flex-1 rounded-2xl bg-white/15 p-3"><p className="text-emerald-100">Gaji acuan</p><p className="font-bold text-sm mt-1">{rp(sal)}</p></div></div>
    </div>
    <Card className="p-5"><div className="flex items-center justify-between mb-3 gap-2"><h2 className="font-bold">Rekomendasi alokasi</h2><span className={"text-xs font-bold rounded-full px-3 py-1 transition "+HC[hc]}>{hl}</span></div>
      {sal?<div className="flex flex-col sm:flex-row items-center gap-5"><div className="w-40 h-40 shrink-0"><AllocChart v={[needs,ef,inv]}/></div>
        <div className="w-full space-y-2.5 text-sm">{[["Kebutuhan wajib",needs,"#64748b"],["Dana darurat (15%)",ef,"#34d399"],["Investasi & goals",inv,"#059669"]].map(([l,v,c])=><div key={l} className="flex items-center gap-3"><i className="w-3 h-3 rounded-full shrink-0" style={{background:c}}/><span className="flex-1 font-medium">{l}</span><span className="text-slate-400">{Math.round(v/sal*100)}%</span><span className="font-semibold w-24 text-right">{rp(v)}</span></div>)}
          <p className="text-xs text-slate-400 pt-1">Cicilan {debtPct.toFixed(0)}% dari gaji (batas sehat 30%). Hanya pemasukan kategori Gaji yang dihitung.</p></div></div>:<Empty t="Catat pemasukan kategori Gaji dulu."/>}

      <div className="relative grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl mb-4"><span className="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] rounded-lg bg-white shadow transition-transform duration-300" style={{transform:pri?"translateX(0)":"translateX(100%)"}}/>
        {[["pri","Kendaraan pribadi","car"],["pub","Transportasi umum","bus"]].map(([k,l,ic])=><button key={k} onClick={()=>up({mode:k})} className={"relative py-2.5 text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors "+(m.mode===k?"text-emerald-700":"text-slate-500")}><I n={ic} s={16}/>{l}</button>)}</div>
      <div className="grid grid-cols-2 gap-3"><Lbl t={pri?"Sekali isi bensin":"Tarif sekali jalan"}><MoneyIn v={m.amt} set={v=>up({amt:v})} ph="50.000"/></Lbl><Lbl t={pri?"Isi bensin / minggu":"Perjalanan / minggu"}><DecIn v={m.freq} set={v=>up({freq:v})} ph="2"/></Lbl></div>
      <div className="flex items-center justify-between rounded-xl bg-emerald-50 p-3"><div><p className="text-xs text-emerald-700">Estimasi per bulan (x4,33)</p><p className="font-extrabold text-emerald-800">{rp(commute)}</p></div><Btn className="!py-2 disabled:opacity-50" disabled={!commute} onClick={()=>{if(m.trLast===mk&&!confirm("Transportasi bulan ini sudah dicatat. Catat lagi?"))return;addTx({type:"expense",amt:commute,cat:"Transportasi",note:"Transportasi bulanan"});up({trLast:mk});toast("Transportasi dicatat: "+rp(commute)+". Saldo berkurang.")}}>Catat</Btn></div>
      {m.trLast===mk&&<p className="text-[11px] text-emerald-700 mt-2">Sudah tercatat bulan ini. Cek di Beranda, Transaksi terakhir.</p>}
      <label className="flex items-center gap-2 mt-3 text-xs font-semibold text-slate-600 cursor-pointer"><input type="checkbox" className="w-4 h-4 accent-emerald-600" checked={!!m.trAuto} onChange={e=>up({trAuto:e.target.checked})}/>Potong otomatis dari saldo tiap bulan</label>
    </Card>
    <Card className="p-5"><h2 className="font-bold mb-3">Cicilan & tagihan tetap</h2>
      <div className="grid grid-cols-2 gap-x-3"><Lbl t="Nama tagihan"><input className={inp} value={bf.name} onChange={e=>setBf({...bf,name:e.target.value})} placeholder="Cicilan motor"/></Lbl><Lbl t="Nominal bulanan"><MoneyIn v={bf.amt} set={v=>setBf({...bf,amt:v})} ph="900.000"/></Lbl>
        <Lbl t="Tenor total (bulan)"><MoneyIn rpx={false} v={bf.tenor} set={v=>setBf({...bf,tenor:v})} ph="24"/></Lbl><Lbl t="Sisa tenor (opsional)"><MoneyIn rpx={false} v={bf.left} set={v=>setBf({...bf,left:v})} ph="sama dengan tenor"/></Lbl><div className="col-span-2"><Lbl t="Tanggal jatuh tempo (opsional, dipotong otomatis dari saldo)"><MoneyIn rpx={false} v={bf.due} set={v=>setBf({...bf,due:v})} ph="25"/></Lbl></div></div>
      <Btn className="w-full mb-4 flex items-center justify-center gap-1.5" onClick={addBill}><I n="plus" s={16}/>Tambah tagihan</Btn>
      {m.bills.length?m.bills.map(b=>{const pc=(b.tenor-b.left)/b.tenor*100;return <div key={b.id} className="pgb rounded-xl bg-slate-50 p-3 mb-2">
        <div className="flex items-center justify-between gap-2"><div className="min-w-0"><p className="font-semibold text-sm truncate">{b.name}</p><p className="text-xs text-slate-400">{rp(b.amt)}/bln - sisa {b.left} dari {b.tenor} bulan</p></div>
          <div className="flex items-center gap-1 shrink-0"><Btn className="!py-1.5 !px-3 !text-xs disabled:opacity-50" disabled={!b.left} onClick={()=>payBill(b)}>Bayar</Btn><button aria-label="Hapus tagihan" onClick={()=>confirm("Hapus tagihan ini?")&&up({bills:m.bills.filter(x=>x.id!==b.id)})} className="text-slate-300 hover:text-red-500 p-1"><I n="trash" s={16}/></button></div></div>
        <div className="h-2 rounded-full bg-slate-200 overflow-hidden mt-2"><div className="bar h-full rounded-full bg-emerald-500" style={{width:pc+"%"}}/></div>
        <p className="text-[11px] text-slate-500 mt-1.5">{pc.toFixed(0)}% terbayar - {b.left?"estimasi lunas "+eta(b.left):"Lunas"}{b.due&&b.left?" - jatuh tempo tgl "+b.due:""}</p></div>}):<Empty t="Belum ada cicilan atau tagihan."/>}
    </Card>
    <Card className="p-5"><div className="flex items-center justify-between mb-3 gap-2"><h2 className="font-bold">Goals & dana darurat</h2>{sal>0&&!hasEf&&<button onClick={()=>up({dreams:[...m.dreams,{id:uid(),name:"Dana Darurat 6x Gaji",target:sal*6,saved:0,months:12}]})} className="text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-full px-3 py-1.5">+ Dana darurat 6x gaji</button>}</div>
      <div className="grid grid-cols-2 gap-x-3"><div className="col-span-2"><Lbl t="Target impian"><input className={inp} value={df.name} onChange={e=>setDf({...df,name:e.target.value})} placeholder="Liburan ke Jepang"/></Lbl></div>
        <Lbl t="Target nominal"><MoneyIn v={df.target} set={v=>setDf({...df,target:v})} ph="30.000.000"/></Lbl><Lbl t="Tenggat (bulan lagi)"><MoneyIn rpx={false} v={df.months} set={v=>setDf({...df,months:v})} ph="12"/></Lbl></div>
      <Btn className="w-full mb-4 flex items-center justify-center gap-1.5" onClick={addDream}><I n="plus" s={16}/>Tambah target</Btn>
      {m.dreams.length?<>{m.dreams.map(x=>{const sv=dsum(x),pc=Math.min(100,sv/x.target*100);return <div key={x.id} className="pgb rounded-xl bg-slate-50 p-3 mb-2">
        <div className="flex items-center justify-between gap-2"><p className="font-semibold text-sm truncate">{x.name}</p><button aria-label="Hapus target" onClick={()=>confirm("Hapus target ini?")&&up({dreams:m.dreams.filter(y=>y.id!==x.id)})} className="text-slate-300 hover:text-red-500 p-1"><I n="trash" s={16}/></button></div>
        <p className="text-xs text-slate-400">Target {rp(x.target)} dalam {x.months} bulan</p>
        <div className="h-2 rounded-full bg-slate-200 overflow-hidden mt-2"><div className="bar h-full rounded-full bg-emerald-500" style={{width:pc+"%"}}/></div>
        <div className="flex justify-between text-xs mt-1.5"><span className="text-slate-500">{pc.toFixed(0)}% ({rp(sv)})</span><span className="font-bold text-emerald-700">Setoran {rp(mo(x))}/bln</span></div>
        <div className="flex gap-2 mt-2"><div className="flex-1 min-w-0"><MoneyIn v={dep[x.id]||""} set={v=>setDep({...dep,[x.id]:v})} ph="Nominal setor"/></div><Btn className="!py-2" onClick={()=>deposit(x)}>Setor</Btn></div></div>})}
        {sal>0&&<p className={"text-xs font-semibold mt-2 "+(gTot>inv?"text-red-600":"text-emerald-700")}>Total setoran {rp(gTot)}/bln dari jatah investasi & goals {rp(inv)}{gTot>inv?" - melebihi jatah, perpanjang tenggat.":"."}</p>}</>:<Empty t="Belum ada target."/>}
    </Card>
  </div>;
}

function App(){
  const [d,setD]=useState(load),[tab,setTab]=useState("home"),[modal,setModal]=useState(null),[gid,setGid]=useState(null),[fresh,setFresh]=useState(null);
  const [tm,setTm]=useState(null),[boom,setBoom]=useState(0),[cvBusy,setCvBusy]=useState(null);
  const busyRef=React.useRef(null),tried=React.useRef({});
  const toast=(m,bad)=>setTm({m,bad,k:Date.now()});
  useEffect(()=>{if(!tm)return;const t=setTimeout(()=>setTm(null),2400);return()=>clearTimeout(t)},[tm]);
  useEffect(()=>{if(!boom)return;const t=setTimeout(()=>setBoom(0),1800);return()=>clearTimeout(t)},[boom]);
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}},[d]);
  useEffect(()=>{const t=new Date(),mk=iso(t).slice(0,7),day=t.getDate(),dt=iso(t);
    setD(s=>{const m=s.mm;let tx=s.tx,ch=false,trLast=m.trLast;
      const bills=m.bills.map(b=>{if(b.due&&b.left>0&&b.last!==mk&&day>=b.due){ch=true;tx=[{id:uid(),type:"expense",amt:b.amt,cat:"Tagihan",note:"Cicilan: "+b.name,date:dt},...tx];return{...b,left:b.left-1,last:mk}}return b});
      const cm=Math.round(num(m.amt)*dec(m.freq)*4.33);
      if(m.trAuto&&cm>0&&trLast!==mk){ch=true;trLast=mk;tx=[{id:uid(),type:"expense",amt:cm,cat:"Transportasi",note:"Transportasi bulanan",date:dt},...tx]}
      return ch?{...s,tx,mm:{...m,bills,trLast}}:s})},[d.mm.bills.length,d.mm.trAuto]);
  const [px,setPx]=useState(()=>{try{return JSON.parse(localStorage.getItem("xav_px"))||{}}catch(e){return {}}});
  const [pxt,setPxt]=useState(0),[pxe,setPxe]=useState("");
  const refresh=async()=>{
    const items=[...new Set(d.inv.filter(a=>!a.manual).map(a=>a.sym+":"+a.kind))];
    if(!items.length)return;
    try{const r=await fetch("/api/prices?items="+encodeURIComponent(items.join(",")));
      if(r.status===404)throw new Error("fungsi /api/prices tidak ditemukan. Pastikan prices.mjs ada di folder netlify/functions/ lalu deploy ulang");
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json().catch(()=>null);if(!j||!j.data)throw new Error("respons tidak valid, fungsi belum aktif");
      setPx(s=>{const n={...s};for(const it in j.data){const sy=it.split(":")[0],x=j.data[it];if(!x.error||!(n[sy]&&n[sy].price))n[sy]=x}return n});
      setPxt(Date.now());setPxe("")}
    catch(e){setPxe("Harga belum bisa dimuat: "+e.message+".")}
  };
  useEffect(()=>{refresh();const t=setInterval(refresh,60000);return()=>clearInterval(t)},[d.inv.length]);
  useEffect(()=>{try{localStorage.setItem("xav_px",JSON.stringify(px))}catch(e){}},[px]);
  useEffect(()=>{if(d.inv.some(a=>a.cost==null&&px[a.sym]&&px[a.sym].price))setD(s=>({...s,inv:s.inv.map(a=>a.cost==null&&px[a.sym]&&px[a.sym].price?{...a,cost:Math.round(a.units*px[a.sym].price)}:a)}))},[px,d.inv]);
  const genCover=async(g,force)=>{
    if(busyRef.current)return;busyRef.current=g.id;setCvBusy(g.id);
    try{const r=await fetch("/api/cover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:g.name,cat:g.cat})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.image)throw new Error(r.status===404?"fungsi /api/cover belum ada":(j.error||("HTTP "+r.status)));
      const img=await shrink(j.image);
      setD(s=>({...s,goals:s.goals.map(x=>x.id===g.id?{...x,cover:img,cvTry:0}:x)}));
      if(force)toast("Gambar AI siap")}
    catch(e){setD(s=>({...s,goals:s.goals.map(x=>x.id===g.id?{...x,cvTry:(x.cvTry||0)+1}:x)}));if(force)toast("Gagal buat gambar: "+e.message,true)}
    busyRef.current=null;setCvBusy(null);
  };
  const tabs=[["home","Beranda","home"],["analytics","Analitik","chart"],["manager","Manager","wallet"],["invest","Investasi","trend"]];
  const nav=k=>{setTab(k);scrollTo({top:0})};
  const save=x=>{
    if(modal==="tx"){setD(s=>({...s,tx:[x,...s.tx]}));setFresh(x.id);nav("home");toast("Transaksi tersimpan")}
    if(modal==="goal"){setD(s=>({...s,goals:[x,...s.goals]}));nav("goals");toast("Tujuan dibuat")}
    if(modal==="inv"){setD(s=>({...s,inv:[...s.inv,x]}));nav("invest");toast("Investasi ditambahkan")}
  };
  const addSave=(id,n)=>{
    const gg=d.goals.find(x=>x.id===id);if(!gg)return;
    const before=gsum(gg,d.inv,px);
    setD(s=>({...s,goals:s.goals.map(x=>x.id===id?{...x,saved:x.saved+n,hist:[{d:iso(new Date()),amt:n},...x.hist]}:x)}));
    if(before<gg.target&&before+n>=gg.target){setBoom(Date.now());toast("Tujuan tercapai!")}else toast("Tabungan ditambahkan");
  };
  const g=d.goals.find(x=>x.id===gid);
  const title={home:"Beranda",analytics:"Analitik",manager:"Money Manager",invest:"Investasi"}[tab];
  const idx=tabs.findIndex(t=>t[0]===tab);
  return <div className="min-h-screen md:pl-64">
    <aside className="hidden md:flex fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-100 flex-col p-5">
      <div className="flex items-center gap-3 mb-8 px-2"><Logo s={40}/><span className="text-2xl font-extrabold tracking-tight lowercase">xav</span></div>
      <nav className="space-y-1.5">{tabs.map(([k,l,ic])=><button key={k} onClick={()=>nav(k)} className={"w-full flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold transition-all hover:translate-x-1 "+(tab===k?"bg-emerald-50 text-emerald-700":"text-slate-500 hover:bg-slate-50")}><I n={ic} s={20}/>{l}</button>)}</nav>
      <Btn className="mt-auto flex items-center justify-center gap-2" onClick={()=>setModal("tx")}><I n="plus" s={18}/>Transaksi</Btn>
    </aside>
    <header className="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-100" style={{paddingTop:"env(safe-area-inset-top)"}}>
      <div className="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
        <div className="flex items-center gap-2.5"><span className="md:hidden"><Logo s={36}/></span><h1 className="text-lg font-extrabold">{title}</h1></div>
        <button onClick={()=>setModal("tx")} className="md:hidden w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center active:scale-90 transition" aria-label="Tambah transaksi"><I n="plus"/></button>
      </div></header>
    <main className="max-w-3xl mx-auto px-4 py-5 pb-28 md:pb-10" key={tab}>
      {tab==="home"&&<Home d={d} setTab={nav} open={setModal} fresh={fresh} reset={()=>confirm("Ganti semua data dengan data contoh?")&&setD(sample())} clear={()=>confirm("Hapus semua data?")&&setD({tx:[],goals:[],inv:[],mm:{mode:"pri",amt:"",freq:"",bills:[],dreams:[]}})}/>}
      {tab==="analytics"&&<Analytics d={d}/>}
      {tab==="manager"&&<Manager d={d} px={px} setD={setD} toast={toast}/>}
      {tab==="invest"&&<Invest d={d} px={px} refresh={refresh} pxt={pxt} pxe={pxe} open={setModal} del={id=>setD(s=>({...s,inv:s.inv.filter(a=>a.id!==id)}))} topup={(a,n)=>{setD(s=>({...s,tx:[{id:uid(),type:"transfer",amt:n,cat:"Investasi",note:"Top up: "+a.name,date:iso(new Date())},...s.tx],inv:s.inv.map(x=>x.id===a.id?{...x,cost:(x.cost||0)+n,cur:x.cur?x.cur+n:x.cur}:x)}));toast("Top up "+a.name+": "+rp(n))}} setval={(id,v)=>{setD(s=>({...s,inv:s.inv.map(x=>x.id===id?{...x,cur:v}:x)}));toast("Nilai diperbarui")}}/>}
    </main>
    <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/90 backdrop-blur border-t border-slate-100" style={{paddingBottom:"env(safe-area-inset-bottom)"}}>
      <div className="relative grid grid-cols-4">
        <div className="absolute top-0 left-0 w-1/4 flex justify-center pointer-events-none transition-transform duration-300 ease-out" style={{transform:`translateX(${idx*100}%)`}}><span className="mt-2.5 w-16 h-7 rounded-full bg-emerald-100"/></div>
        {tabs.map(([k,l,ic])=><button key={k} onClick={()=>nav(k)} className={"relative py-2.5 flex flex-col items-center gap-1 text-[11px] font-semibold transition-colors "+(tab===k?"text-emerald-700":"text-slate-400")}><span className="px-5 py-1 inline-flex active:scale-90 transition-transform"><I n={ic} s={20}/></span>{l}</button>)}
      </div></nav>
    {modal&&<AddModal kind={modal} goals={d.mm.dreams} onClose={()=>setModal(null)} onSave={save}/>}
    {g&&<GoalModal g={g} inv={d.inv} px={px} busy={cvBusy===g.id} onClose={()=>setGid(null)} onAdd={addSave} onGen={x=>genCover(x,true)} onDel={id=>setD(s=>({...s,goals:s.goals.filter(x=>x.id!==id),inv:s.inv.map(a=>a.goal===id?{...a,goal:null}:a)}))}/>}
    {tm&&<div key={tm.k} role="status" className={"toast fixed left-1/2 bottom-24 md:bottom-8 z-[60] flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-semibold text-white shadow-xl max-w-[90vw] "+(tm.bad?"bg-red-600":"bg-slate-900")}>{!tm.bad&&<span className="tick w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center shrink-0"><I n="check" s={12}/></span>}<span className="truncate">{tm.m}</span></div>}
    {boom>0&&<Confetti k={boom}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
